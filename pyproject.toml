[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mind-meld"
version = "0.12.33"
description = "Sync AI coding-agent context across machines via iCloud Drive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Karl Bitz" }]
keywords = ["claude", "codex", "opencode", "sync", "cli", "encryption", "icloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "keyring>=25.0",
    "rich>=13.0",
    "packaging>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff==0.15.12",
]

[project.scripts]
mm = "mind_meld.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mind_meld"]
# src/mind_meld/skills/ is a real subpackage (__init__.py present) so it
# ships automatically via packages=. Group 8's retro-fleet/SKILL.md files
# land inside that subpackage and are findable via
# importlib.resources.files("mind_meld") / "skills". No force-include
# needed; force-include + packages= would double-ship the same files.

[tool.pytest.ini_options]
markers = [
    "owns_skill_paths: test moves $HOME itself; conftest's _isolate_skill_links steps aside",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Defaults (E, F) + W (pycodestyle warnings) + I (isort).
select = ["E", "F", "W", "I"]
