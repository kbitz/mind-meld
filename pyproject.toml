[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mind-meld"
version = "0.6.0"
description = "Sync Claude Code sessions and AI developer context across machines via iCloud Drive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Mind Meld Contributors" }]
keywords = ["claude", "sync", "cli", "encryption", "icloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "keyring>=25.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mm = "mind_meld.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mind_meld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
