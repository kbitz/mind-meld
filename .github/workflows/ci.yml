name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e .[dev]

      - name: Verify keyring backend
        # macOS-CI-only: tests runner provisioning (the real Keychain backend
        # loaded, not fail.Keyring). A hard false failure in a Linux cloud
        # workspace, so this stays out of ./bin/check.
        run: |
          python -c "
          import keyring
          backend = str(keyring.get_keyring())
          assert 'macOS' in backend or 'Keychain' in backend, f'unexpected backend: {backend}'
          print(backend)
          "

      - name: Portable checks
        # Local and CI share one command for the portable checks (ruff check,
        # ruff format --check, pytest). They do not run the same complete
        # qualification — keyring and the wheel smoke stay CI-only.
        #
        # --no-bootstrap + MM_PYTHON=setup-python's interpreter: do not build
        # a second environment, and do not let `python3.13` on PATH silently
        # resolve to brew instead of this job's pin.
        run: |
          python -c "import sys; print('setup-python:', sys.executable, sys.version)"
          MM_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export MM_PYTHON
          echo "MM_PYTHON=$MM_PYTHON"
          ./bin/check --no-bootstrap

      - name: Build and smoke the wheel
        # Isolated disposable venv. `pip install --force-reinstall dist/*.whl`
        # into THIS job's env would replace the editable install; with a src/
        # layout, `import mind_meld` then resolves to site-packages and later
        # steps silently test stale code. `devices --format json` against a
        # real ~/.config/mind-meld/config.toml reaches iCloud and the Keychain,
        # so HOME is a throwaway directory.
        run: |
          python -m pip install build
          python -m build
          smoke=$(mktemp -d)
          python -m venv "$smoke/venv"
          "$smoke/venv/bin/python" -m pip install dist/*.whl
          "$smoke/venv/bin/mm" --version
          # The `-m` path is what the shipped retro-fleet skill actually uses:
          # aggregator.get_known_devices() runs
          # `sys.executable -m mind_meld.cli devices --format json` and parses
          # the stdout as JSON. It degrades to (None, []) on ANY failure, so a
          # break here is silent -- every retro card just quietly drops its
          # "of M devices" tail. CI only ever smoked the console-script path.
          "$smoke/venv/bin/python" -m mind_meld.cli --version
          iso_home=$(mktemp -d)
          if HOME="$iso_home" "$smoke/venv/bin/python" -m mind_meld.cli devices --format json > /tmp/devices.out 2>/tmp/devices.err; then
            "$smoke/venv/bin/python" -c "import json,sys; json.load(open('/tmp/devices.out'))"
          else
            if grep -q 'Traceback' /tmp/devices.err; then
              echo "::error::-m entrypoint crashed"
              cat /tmp/devices.err
              exit 1
            fi
          fi
