name: Release

# Auto-tag, auto-create-Release, and auto-append-PROGRESS on push to main
# whenever pyproject.toml's version (or its CHANGELOG entry) changes.
#
# Why this exists: prior to 2026-05-05, tag creation was a manual step at
# merge time and got skipped (orphaning v0.11.23 in pyproject), GitHub
# Releases needed periodic bulk backfills (24 missing entries by then),
# and PROGRESS.md drifted 19 rows behind. This workflow eliminates all
# three drift modes by making tag + release + progress-row a single
# automatic consequence of merging a version bump.
#
# Idempotency: each step checks if its target already exists and no-ops
# if so, so re-runs after a partial-failure are safe.
#
# Loop avoidance: the workflow's PROGRESS.md commit only touches
# docs/PROGRESS.md, which is NOT in the paths filter, so the workflow
# does not re-trigger itself.

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - CHANGELOG.md

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from pyproject.toml
        id: ver
        run: |
          version=$(grep -E '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::Could not parse version from pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Detected version: $version (tag: v$version)"

      - name: Check tag + release existence
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $tag already exists locally"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG body for this version
        id: notes
        run: |
          version="${{ steps.ver.outputs.version }}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > "$notes_file"
          # Trim leading/trailing blank lines.
          # Empty file = no CHANGELOG entry → fail loudly.
          if ! [ -s "$notes_file" ] || [ -z "$(tr -d '[:space:]' < "$notes_file")" ]; then
            echo "::error::No CHANGELOG entry found for version $version. Add a '## [$version] - YYYY-MM-DD' section to CHANGELOG.md and push again."
            exit 1
          fi
          # Date from the version header line
          date=$(grep -E "^## \[$version\]" CHANGELOG.md | head -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "Extracted $(wc -c < "$notes_file") bytes of release notes; date=$date"

      - name: Create + push tag
        if: steps.check.outputs.tag_exists == 'false'
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          echo "Pushed tag $tag at $(git rev-parse HEAD)"

      - name: Create GitHub Release
        if: steps.check.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file "${{ steps.notes.outputs.notes_file }}"

      - name: Append PROGRESS.md row
        run: |
          version="${{ steps.ver.outputs.version }}"
          date="${{ steps.notes.outputs.date }}"
          if grep -qE "^\| $version " docs/PROGRESS.md; then
            echo "PROGRESS.md already has v$version row; skipping"
            exit 0
          fi
          # Lead paragraph: from version header to first ### or next ## [
          lead=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && (/^## \[/ || /^### /) { exit }
            flag { print }
          ' CHANGELOG.md | tr '\n' ' ' | sed -E 's/  +/ /g; s/^ //; s/ $//; s/\|/\\|/g')
          if [ -z "$lead" ]; then
            echo "::error::Could not extract lead paragraph for v$version"
            exit 1
          fi
          row="| $version | $date | $lead |"
          # Insert row directly after the table separator line
          # (which is the unique fixed-width `|---|---|---|` divider).
          marker='|---------|----------|----------|'
          if ! grep -qF "$marker" docs/PROGRESS.md; then
            echo "::error::PROGRESS.md table separator not found; cannot append"
            exit 1
          fi
          tmp=$(mktemp)
          while IFS= read -r line; do
            printf '%s\n' "$line" >> "$tmp"
            if [ "$line" = "$marker" ]; then
              printf '%s\n' "$row" >> "$tmp"
            fi
          done < docs/PROGRESS.md
          mv "$tmp" docs/PROGRESS.md
          echo "Appended PROGRESS row for v$version"
          if git diff --quiet docs/PROGRESS.md; then
            echo "PROGRESS.md unchanged after append (race with concurrent edit?); skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROGRESS.md
          git commit -m "chore(progress): append v$version row [skip ci]"
          git push
