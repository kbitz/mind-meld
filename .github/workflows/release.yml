name: Release

# Auto-tag and auto-create-Release on push to main whenever
# pyproject.toml's version (or its CHANGELOG entry) changes.
#
# Why this exists: prior to 2026-05-05, tag creation was a manual step
# at merge time and got skipped (orphaning v0.11.23 in pyproject) and
# GitHub Releases needed periodic bulk backfills (24 missing entries by
# then). This workflow eliminates both drift modes by making tag +
# release a single automatic consequence of merging a version bump.
#
# PROGRESS.md row is NOT auto-appended: branch protection on main
# requires PRs, and a workflow trying to `git push` a chore commit
# directly is rejected by the ruleset (see v0.11.24 and v0.11.25 release
# runs for the failure mode). The convention is: include the PROGRESS
# row in the same PR as the pyproject + CHANGELOG bump. /ship should
# do this; manual fallback otherwise.
#
# Idempotency: each step checks if its target already exists and no-ops
# if so, so re-runs after a partial-failure are safe.

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - CHANGELOG.md

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version from pyproject.toml
        id: ver
        run: |
          version=$(grep -E '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::Could not parse version from pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Detected version: $version (tag: v$version)"

      - name: Check tag + release existence
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $tag already exists locally"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG body for this version
        id: notes
        run: |
          version="${{ steps.ver.outputs.version }}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > "$notes_file"
          # Trim leading/trailing blank lines.
          # Empty file = no CHANGELOG entry → fail loudly.
          if ! [ -s "$notes_file" ] || [ -z "$(tr -d '[:space:]' < "$notes_file")" ]; then
            echo "::error::No CHANGELOG entry found for version $version. Add a '## [$version] - YYYY-MM-DD' section to CHANGELOG.md and push again."
            exit 1
          fi
          # Date from the version header line
          date=$(grep -E "^## \[$version\]" CHANGELOG.md | head -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "Extracted $(wc -c < "$notes_file") bytes of release notes; date=$date"

      - name: Create + push tag
        if: steps.check.outputs.tag_exists == 'false'
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
          echo "Pushed tag $tag at $(git rev-parse HEAD)"

      - name: Create GitHub Release
        if: steps.check.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file "${{ steps.notes.outputs.notes_file }}"

      - name: Advance latest branch to released commit
        # The `latest` branch is the moving ref that `pipx install …@latest`
        # (and the auto-upgrade nudge) tracks, so `pipx upgrade mind-meld`
        # actually advances. A git tag is frozen — pipx re-resolves the same
        # `@vX.Y.Z` commit forever, which is the lock users hit. A branch ref
        # re-resolves to its HEAD, so force-advancing `latest` to each tagged
        # release commit is what makes upgrades land. `latest` only ever points
        # at released commits, so installs never get untagged WIP off main.
        #
        # Runs AFTER tag + Release so a transient push hiccup on this convenience
        # ref never delays the primary artifacts. Unconditional + force =
        # idempotent: a re-run force-pushes the same commit, and the tag/Release
        # steps above no-op via their existence checks. `latest` is NOT a
        # protected branch, so the workflow token can push to it directly
        # (unlike main). HEAD is this release's commit.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "+HEAD:refs/heads/latest"
          echo "Advanced latest -> $(git rev-parse HEAD) (${{ steps.ver.outputs.tag }})"

      - name: Verify PROGRESS.md row exists
        run: |
          version="${{ steps.ver.outputs.version }}"
          if ! grep -qE "^\| $version " docs/PROGRESS.md; then
            echo "::warning::docs/PROGRESS.md is missing a row for v$version. Add it in a follow-up PR — workflow cannot push to main under branch protection."
          else
            echo "PROGRESS.md row for v$version present."
          fi
